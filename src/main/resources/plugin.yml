name: IcarusChests
version: '${version}'
main: dev.icaro.icaruschests.IcarusChestsPlugin
api-version: '1.21'
author: IcaroFranca
description: Tiered storage chests for Paper servers, inspired by Sophisticated Storage.
website: https://github.com/IcaroFranca/IcarusChests

commands:
  icaruschests:
    description: Main IcarusChests command.
    aliases: [icarus, ic]
    usage: /<command> <ping|info|give|reload>

permissions:
  icaruschests.info:
    description: Permite usar /icaruschests info.
    default: true
  icaruschests.admin:
    description: Acesso aos comandos administrativos do IcarusChests (give, reload).
    default: op
