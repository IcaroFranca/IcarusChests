plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
}

group = 'dev.icaro.icaruschests'
version = '0.1.0-SNAPSHOT'
description = 'IcarusChests - tiered storage chests for Paper servers, inspired by Sophisticated Storage.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    // Avoid classpath collisions with other plugins that also shade sqlite-jdbc.
    relocate 'org.sqlite', 'dev.icaro.icaruschests.libs.sqlite'
}

tasks.build {
    dependsOn 'shadowJar'
}

runServer {
    minecraftVersion('1.21.1')
}
